<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Trivy Scan</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #ffffff;
      --fg: #1f2328;
      --muted: #656d76;
      --border: #d0d7de;
      --row-alt: #f6f8fa;
      --link: #0969da;
      --critical: #b42318;
      --high: #c4320a;
      --medium: #9a6700;
      --low: #1a7f37;
      --unknown: #656d76;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0d1117;
        --fg: #e6edf3;
        --muted: #8d96a0;
        --border: #30363d;
        --row-alt: #161b22;
        --link: #4493f8;
        --critical: #ff7b72;
        --high: #ffa657;
        --medium: #d29922;
        --low: #3fb950;
        --unknown: #8d96a0;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 24px 16px;
      background: var(--bg);
      color: var(--fg);
      font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    main { max-width: 1200px; margin: 0 auto; }
    h1 { margin: 0 0 4px; font-size: 20px; }
    .meta { margin: 0 0 16px; color: var(--muted); }
    .toolbar {
      display: grid;
      grid-template-columns: 1fr minmax(240px, 320px);
      gap: 12px;
      align-items: center;
      margin-bottom: 16px;
    }
    @media (max-width: 640px) {
      .toolbar { grid-template-columns: 1fr; }
    }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .count {
      display: inline-flex;
      align-items: center;
      height: 28px;
      padding: 0 10px;
      border: 1px solid var(--border);
      border-radius: 999px;
      line-height: 1;
    }
    .count[hidden] { display: none; }
    .verdict { border-color: currentColor; }
    button.count { background: none; font-family: inherit; font-size: inherit; cursor: pointer; }
    button.count[aria-pressed="false"] { opacity: 0.4; text-decoration: line-through; }
    button.count:focus-visible, th button:focus-visible { outline: 2px solid var(--link); outline-offset: 2px; }
    input {
      width: 100%;
      padding: 6px 10px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--bg);
      color: var(--fg);
      font: inherit;
    }
    .table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: 6px; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 8px 12px; text-align: left; vertical-align: top; border-bottom: 1px solid var(--border); }
    th { position: sticky; top: 0; background: var(--row-alt); white-space: nowrap; }
    th button {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 0;
      border: 0;
      background: none;
      color: inherit;
      font: inherit;
      cursor: pointer;
    }
    th button::after { content: "↕"; color: var(--muted); font-size: 12px; }
    th[aria-sort="ascending"] button::after { content: "▲"; color: inherit; }
    th[aria-sort="descending"] button::after { content: "▼"; color: inherit; }
    tbody tr:nth-child(even) { background: var(--row-alt); }
    tbody tr:last-child td { border-bottom: 0; }
    td.nowrap { white-space: nowrap; }
    a { color: var(--link); }
    .sev { font-weight: 600; }
    .sev-CRITICAL { color: var(--critical); }
    .sev-HIGH { color: var(--high); }
    .sev-MEDIUM { color: var(--medium); }
    .sev-LOW { color: var(--low); }
    .sev-UNKNOWN { color: var(--unknown); }
    .empty { padding: 24px; text-align: center; color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <h1>Trivy scan</h1>
    <p class="meta" id="meta">Loading…</p>
    <div class="toolbar">
      <div class="chips">
        <span id="verdict" class="count verdict" hidden></span>
        <div id="counts" class="chips"></div>
      </div>
      <input id="filter" type="search" placeholder="Filter by target, package, CVE, or title">
    </div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th data-key="Severity"><button type="button">Severity</button></th>
            <th data-key="Target"><button type="button">Target</button></th>
            <th data-key="PkgName"><button type="button">Package</button></th>
            <th data-key="InstalledVersion"><button type="button">Installed</button></th>
            <th data-key="FixedVersion"><button type="button">Fixed</button></th>
            <th data-key="VulnerabilityID"><button type="button">Vulnerability</button></th>
            <th data-key="Title"><button type="button">Title</button></th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </main>
  <!-- trivy.js sets window.TRIVY_REPORT (and TRIVY_FAIL_ON) so the page also works from file://. -->
  <script src="trivy.js" onerror="void 0"></script>
  <script>
    const SEVERITIES = ['CRITICAL', 'HIGH', 'MEDIUM', 'LOW', 'UNKNOWN'];
    const collator = new Intl.Collator(undefined, { numeric: true, sensitivity: 'base' });
    const state = { query: '', hidden: new Set(), sortKey: 'Severity', sortDir: 'desc' };

    // Higher rank is more severe, so a descending sort puts CRITICAL first.
    function severityRank(severity) {
      const index = SEVERITIES.indexOf(severity);
      return index === -1 ? 0 : SEVERITIES.length - index;
    }

    // CVE-2026-102473 sorts after CVE-2026-65182: compare year, then number, as integers.
    function compareIds(a, b) {
      const pa = /^([A-Z]+)-(\d+)-(\d+)$/i.exec(a);
      const pb = /^([A-Z]+)-(\d+)-(\d+)$/i.exec(b);
      if (pa && pb) {
        return collator.compare(pa[1], pb[1]) || pa[2] - pb[2] || pa[3] - pb[3];
      }
      return collator.compare(a, b);
    }

    const COMPARATORS = {
      Severity: (a, b) => severityRank(a.Severity) - severityRank(b.Severity),
      VulnerabilityID: (a, b) => compareIds(a.VulnerabilityID, b.VulnerabilityID),
    };

    function compareText(key) {
      return (a, b) => collator.compare(a[key] ?? '', b[key] ?? '');
    }

    function sortVulns(vulns) {
      const { sortKey, sortDir } = state;
      const primary = COMPARATORS[sortKey] ?? compareText(sortKey);
      const sign = sortDir === 'asc' ? 1 : -1;
      return [...vulns].sort((a, b) => {
        // Rows without a value (such as no fixed version) stay last in either direction.
        if (!a[sortKey] !== !b[sortKey]) {
          return a[sortKey] ? -1 : 1;
        }
        return sign * primary(a, b)
          || severityRank(b.Severity) - severityRank(a.Severity)
          || collator.compare(a.PkgName, b.PkgName)
          || compareIds(a.VulnerabilityID, b.VulnerabilityID);
      });
    }

    function filterVulns(vulns) {
      const query = state.query;
      return vulns.filter((v) => !state.hidden.has(v.Severity)
        && (!query || [v.Target, v.PkgName, v.VulnerabilityID, v.Title, v.Severity]
          .some((s) => s?.toLowerCase().includes(query))));
    }

    async function loadReport() {
      if (window.TRIVY_REPORT) {
        return window.TRIVY_REPORT;
      }
      const response = await fetch('trivy.json');
      if (!response.ok) {
        throw new Error(`trivy.json: HTTP ${response.status}`);
      }
      return response.json();
    }

    function cell(text, className) {
      const td = document.createElement('td');
      td.textContent = text ?? '';
      if (className) {
        td.className = className;
      }
      return td;
    }

    function flatten(report) {
      return (report.Results ?? [])
        .flatMap((result) => (result.Vulnerabilities ?? []).map((v) => ({ ...v, Target: result.Target })));
    }

    function renderCounts(vulns, onChange) {
      const counts = document.getElementById('counts');
      counts.replaceChildren(...SEVERITIES
        .map((severity) => [severity, vulns.filter((v) => v.Severity === severity).length])
        .filter(([, n]) => n > 0)
        .map(([severity, n]) => {
          const button = document.createElement('button');
          button.type = 'button';
          button.className = `count sev sev-${severity}`;
          button.textContent = `${severity} ${n}`;
          button.title = `Show or hide ${severity} findings`;
          button.setAttribute('aria-pressed', 'true');
          button.addEventListener('click', () => {
            const shown = state.hidden.has(severity);
            if (shown) {
              state.hidden.delete(severity);
            } else {
              state.hidden.add(severity);
            }
            button.setAttribute('aria-pressed', String(shown));
            onChange();
          });
          return button;
        }));
    }

    function renderSortHeaders() {
      document.querySelectorAll('th[data-key]').forEach((th) => {
        if (th.dataset.key === state.sortKey) {
          th.setAttribute('aria-sort', state.sortDir === 'asc' ? 'ascending' : 'descending');
        } else {
          th.removeAttribute('aria-sort');
        }
      });
    }

    function renderRows(vulns, total) {
      const rows = document.getElementById('rows');
      if (vulns.length === 0) {
        const tr = document.createElement('tr');
        const td = cell(total ? 'No matching vulnerabilities' : 'No vulnerabilities', 'empty');
        td.colSpan = 7;
        tr.append(td);
        rows.replaceChildren(tr);
        return;
      }
      rows.replaceChildren(...vulns.map((v) => {
        const tr = document.createElement('tr');
        const id = cell('', 'nowrap');
        if (v.PrimaryURL) {
          const link = document.createElement('a');
          link.href = v.PrimaryURL;
          link.target = '_blank';
          link.rel = 'noopener';
          link.textContent = v.VulnerabilityID;
          id.append(link);
        } else {
          id.textContent = v.VulnerabilityID;
        }
        tr.append(
          cell(v.Severity, `nowrap sev sev-${v.Severity}`),
          cell(v.Target),
          cell(v.PkgName),
          cell(v.InstalledVersion, 'nowrap'),
          cell(v.FixedVersion),
          id,
          cell(v.Title));
        return tr;
      }));
    }

    loadReport()
      .then((report) => {
        const vulns = flatten(report);
        const failOn = window.TRIVY_FAIL_ON?.split(',');
        const created = report.CreatedAt ? new Date(report.CreatedAt).toLocaleString() : 'unknown time';
        document.getElementById('meta').textContent =
          [report.ArtifactName ?? 'Unknown artifact', `scanned ${created}`, `${vulns.length} findings`,
            failOn && `fails on ${failOn.join(', ')}`].filter(Boolean).join(' · ');
        if (failOn) {
          const failing = vulns.filter((v) => failOn.includes(v.Severity)).length;
          const verdict = document.getElementById('verdict');
          verdict.textContent = failing ? `FAIL ${failing}` : 'PASS';
          verdict.className = `count verdict sev ${failing ? 'sev-CRITICAL' : 'sev-LOW'}`;
          verdict.hidden = false;
        }
        const render = () => {
          renderSortHeaders();
          renderRows(sortVulns(filterVulns(vulns)), vulns.length);
        };
        renderCounts(vulns, render);
        document.getElementById('filter').addEventListener('input', (event) => {
          state.query = event.target.value.trim().toLowerCase();
          render();
        });
        document.querySelectorAll('th[data-key] button').forEach((button) => {
          button.addEventListener('click', () => {
            const key = button.parentElement.dataset.key;
            if (state.sortKey === key) {
              state.sortDir = state.sortDir === 'asc' ? 'desc' : 'asc';
            } else {
              state.sortKey = key;
              // Severity starts most severe first; text columns start A to Z.
              state.sortDir = key === 'Severity' ? 'desc' : 'asc';
            }
            render();
          });
        });
        render();
      })
      .catch((error) => {
        document.getElementById('meta').textContent =
          `Could not load the report (${error.message}). Run make scan, or serve this directory over HTTP.`;
      });
  </script>
</body>
</html>
