<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: page('Dashboard', ~{::main})}">
<main>
    <p class="kicker">Dashboard</p>
    <h1>Tasks that still need attention.</h1>
    <p class="lede">Open and in-progress reports, highest priority first.</p>
    <section class="stats" aria-label="Report counts">
        <div><strong th:text="${dashboard.open}">0</strong><span>Open</span></div>
        <div><strong th:text="${dashboard.inProgress}">0</strong><span>In progress</span></div>
        <div><strong th:text="${dashboard.resolved}">0</strong><span>Resolved</span></div>
        <div><strong th:text="${dashboard.closed}">0</strong><span>Closed</span></div>
    </section>
    <ol class="tasks" th:if="${!dashboard.tasks.empty}">
        <li th:each="task : ${dashboard.tasks}" th:classappend="${task.priority}">
            <a th:href="@{/reports/{id}(id=${task.id})}" th:text="${task.id}">RPT-1</a>
            <a class="title" th:href="@{/reports/{id}(id=${task.id})}" th:text="${task.title}">Login</a>
            <span class="pill" th:text="${task.status}">OPEN</span>
            <span class="pill" th:text="${task.priority}">HIGH</span>
            <span class="pill" th:text="${task.type}">BUG</span>
        </li>
    </ol>
    <p class="lede" th:if="${dashboard.tasks.empty}">Nothing is open or in progress.</p>
    <p class="links"><a href="/reports">All reports</a></p>
</main>
</html>
