<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: page(${report.title}, ~{::main})}">
<main>
    <p class="kicker" th:text="${report.id}">RPT-1</p>
    <h1 th:text="${report.title}">Title</h1>
    <p class="badges">
        <span class="badge" th:if="${report.status != null}" th:attr="data-status=${report.status}" th:text="${#strings.replace(report.status, '_', ' ')}">Open</span>
        <span class="badge" th:if="${report.priority != null}" th:attr="data-priority=${report.priority}" th:text="${report.priority}">High</span>
        <span class="badge" th:if="${report.type != null}" th:attr="data-type=${report.type}" th:text="${report.type}">Bug</span>
    </p>
    <p class="lede" th:text="${report.description}">Description</p>
    <dl class="facts">
        <div><dt>Author</dt><dd th:text="${report.author}">author</dd></div>
        <div><dt>Assignee</dt><dd th:text="${report.assignee}">assignee</dd></div>
        <div><dt>Created</dt><dd th:text="${#temporals.format(report.createdOn, 'yyyy-MM-dd HH:mm')}">created</dd></div>
        <div><dt>Updated</dt><dd th:text="${#temporals.format(report.updatedOn, 'yyyy-MM-dd HH:mm')}">updated</dd></div>
    </dl>
    <ul class="tags">
        <li th:each="tag : ${report.tags}" th:text="${tag}">tag</li>
    </ul>
    <p class="actions">
        <button type="button" id="delete-report" class="danger" aria-haspopup="dialog">Delete</button>
    </p>
    <dialog id="delete-dialog" class="dialog" aria-labelledby="delete-title" aria-describedby="delete-description" th:data-id="${report.id}">
        <form id="delete-form" method="dialog">
            <h2 id="delete-title">Delete <span th:text="${report.id}">RPT-1</span>?</h2>
            <p id="delete-description">This permanently deletes <strong th:text="${report.title}">Title</strong>. It cannot be undone.</p>
            <label for="delete-confirm">Type <code th:text="${report.id}">RPT-1</code> to confirm</label>
            <input id="delete-confirm" name="confirm" autocomplete="off" spellcheck="false" autocapitalize="off">
            <p id="delete-error" class="error" role="alert" hidden></p>
            <div class="dialog-actions">
                <button type="button" id="delete-cancel" class="secondary" autofocus>Cancel</button>
                <button type="submit" id="delete-submit" class="danger" disabled>Delete report</button>
            </div>
        </form>
    </dialog>
    <script type="module" src="/js/pages/report.js"></script>
</main>
</html>
