<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:fragment="page(title, body)">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title}">Reporter</title>
    <link rel="icon" th:href="@{/favicon.ico}" sizes="32x32">
    <link rel="icon" th:href="@{/favicon.svg}" type="image/svg+xml">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<header class="site">
    <nav aria-label="Site">
        <a class="brand" href="/">Reporter</a>
        <a href="/reports">Reports</a>
        <!--/*@thymesVar id="swagger" type="java.lang.String"*/-->
        <a th:href="${swagger}" target="_blank" rel="noopener noreferrer">API</a>
    </nav>
</header>
<div class="page">
    <!--/*@thymesVar id="crumbs" type="java.util.List<org.acme.reporter.web.Crumb>"*/-->
    <!--/*@thymesVar id="crumb" type="org.acme.reporter.web.Crumb"*/-->
    <nav class="crumbs" th:if="${!#lists.isEmpty(crumbs)}" aria-label="Breadcrumb">
        <ol>
            <li th:each="crumb, state : ${crumbs}">
                <!--/*@thymesVar id="crumb" type="org.acme.reporter.web.Crumb"*/-->
                <span class="sep" th:if="${!state.first}" aria-hidden="true">/</span>
                <a th:if="${crumb.href != null}" th:href="@{${crumb.href}}" th:text="${crumb.label}">Dashboard</a>
                <span th:if="${crumb.href == null}" th:text="${crumb.label}" aria-current="page">Reports</span>
            </li>
        </ol>
    </nav>
    <main th:replace="${body}">Content</main>
</div>
<footer class="site">
    <!--/*@thymesVar id="github" type="java.lang.String"*/-->
    <a th:href="${github}" target="_blank" rel="noopener noreferrer">
        <svg viewBox="0 0 16 16" aria-hidden="true">
            <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0 0 16 8c0-4.42-3.58-8-8-8z"></path>
        </svg>
        GitHub
    </a>
</footer>
</body>
</html>
