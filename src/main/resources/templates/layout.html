<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:fragment="page(title, body)">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title}">Reporter</title>
    <link rel="icon" th:href="@{/favicon.ico}" sizes="32x32">
    <link rel="icon" th:href="@{/favicon.svg}" type="image/svg+xml">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<header class="site">
    <nav aria-label="Site">
        <a class="brand" href="/">Reporter</a>
        <a href="/reports">Reports</a>
        <a href="/swagger-ui.html" target="_blank" rel="noopener noreferrer">API</a>
    </nav>
</header>
<div class="page">
    <nav class="crumbs" th:if="${!#lists.isEmpty(crumbs)}" aria-label="Breadcrumb">
        <ol>
            <li th:each="crumb, state : ${crumbs}">
                <span class="sep" th:if="${!state.first}" aria-hidden="true">/</span>
                <a th:if="${crumb.href != null}" th:href="@{${crumb.href}}" th:text="${crumb.label}">Dashboard</a>
                <span th:if="${crumb.href == null}" th:text="${crumb.label}" aria-current="page">Reports</span>
            </li>
        </ol>
    </nav>
    <main th:replace="${body}">Content</main>
</div>
</body>
</html>
